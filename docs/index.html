<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museum as Code - National Museum of Korea</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 data-lang-ko="Museum as Code - 국립중앙박물관" data-lang-en="Museum as Code - National Museum of Korea">Museum as Code - National Museum of Korea</h1>
    <button type="button" id="lang-toggle" aria-label="Toggle language">EN / 한</button>
  </header>
  <main>
    <div class="tab-bar">
      <button type="button" class="tab-btn active" data-tab="graph" data-lang-ko="그래프" data-lang-en="Graph">Graph</button>
      <button type="button" class="tab-btn" data-tab="cards" data-lang-ko="카드" data-lang-en="Cards">Cards</button>
    </div>
    <div id="cy" class="tab-content active">
      <div id="edge-filters">
        <label><input type="checkbox" data-edge-type="category" checked> <span class="edge-swatch" style="background:#66aa77"></span><span data-lang-ko="분류" data-lang-en="Category">Category</span></label>
        <label><input type="checkbox" data-edge-type="era" checked> <span class="edge-swatch" style="background:#6699cc"></span><span data-lang-ko="시대" data-lang-en="Era">Era</span></label>
        <label><input type="checkbox" data-edge-type="location" checked> <span class="edge-swatch" style="background:#cc9944"></span><span data-lang-ko="소장처" data-lang-en="Location">Location</span></label>
        <label><input type="checkbox" data-edge-type="material" checked> <span class="edge-swatch" style="background:#9966cc"></span><span data-lang-ko="재질" data-lang-en="Material">Material</span></label>
      </div>
    </div>
    <section id="card-grid" class="tab-content" aria-label="Artifact collection">
      <!-- T13에서 .artifact-card 요소들이 여기에 동적으로 삽입됨 -->
    </section>
  </main>
  <div id="artifact-detail" class="hidden" role="dialog" aria-modal="true">
    <div id="detail-panel">
      <button type="button" id="detail-close" aria-label="Close detail view">✕ 닫기 / Close</button>
      <div id="detail-content">
        <!-- T14에서 채워짐 -->
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.33.1/cytoscape.min.js"></script>
  <script src="graph.js"></script>
  <script src="app.js"></script>
</body>
</html>
